# This GitHub Action workflow automates the process of building a Hugo site
# and deploying it to Cloudflare Workers. Test

name: Deploy Hugo to Cloudflare Workers

on:
  # Trigger the workflow on push events to the main branch
  push:
    branches:
      - main
  # Allow manual triggering of the workflow from the GitHub UI
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest # Use the latest Ubuntu runner

    steps:
      # Step 1: Checkout the repository
      # This action checks out your repository under $GITHUB_WORKSPACE,
      # so your workflow can access it.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Hugo
      # This action sets up the Hugo environment.
      # Specify the Hugo version you want to use.
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.143.1' # Or a specific version like '0.127.0'
          # extended: true # Uncomment if you are using Hugo extended for Sass/SCSS

      # Step 3: Build Hugo site
      # This command builds your Hugo site into the 'public' directory.
      - name: Build Hugo site
        run: hugo # Or specify flags like 'hugo --minify' for production builds

      # Step 4: Install Cloudflare Wrangler
      # Wrangler is the CLI tool for Cloudflare Workers.
      # We install it globally using npm.
      - name: Install Cloudflare Wrangler
        run: npm install -g wrangler

      # Step 5: Deploy to Cloudflare Workers
      # This step uses Wrangler to deploy the built Hugo site.
      # The 'public' directory is treated as the static asset directory for the Worker.
      - name: Deploy to Cloudflare Workers
        run: wrangler pages deploy public --project-name ${{ secrets.CLOUDFLARE_PROJECT_NAME }} --commit-dirty=false
        env:
          # Your Cloudflare API Token, stored as a GitHub secret.
          # You need to create a secret named CLOUDFLARE_API_TOKEN in your GitHub repository.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Your Cloudflare Account ID, stored as a GitHub secret.
          # You need to create a secret named CLOUDFLARE_ACCOUNT_ID in your GitHub repository.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
