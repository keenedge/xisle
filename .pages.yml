media: media
content:
  - name: pins
    label: Pins
    type: collection
    path: 'content\pins'
    view:
      fields: [ title, published, date ]
    fields:
      - name: published
        label: Published
        type: boolean
        default: true
      - name: date
        label: Date
        type: date
      - name: title
        label: Title
        type: string
      - name: location
        type: object
        fields:
        - name: latitude
          label: Latitude
          type: number
          default: 0
          required: true
        - name: longitude
          label: Longitude
          type: number
          default: 0
          required: true
        - name: elevation
          label: Elevation
          type: number
          default: 0
          required: true
      - name: description
        label: Description
        type: rich-text
  - name: areas
    label: Areas
    type: collection
    path: 'content\areas'
    view:
      fields: [ title, published, date ]
    fields:
      - name: published
        label: Published
        type: boolean
        default: true
      - name: date
        label: Date
        type: date
      - name: title
        label: Title
        type: string
      - name: description
        label: description
        type: rich-text        